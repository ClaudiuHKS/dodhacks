
;
; check for wounds once in x seconds
;
; increase this value for slower healing
; decrease this value for faster healing
;

"@task_interval"        "0.5"

;
; delay from initial wound time to beginning of healing process
;
; measured in second(s)
;

"@wound_delay"          "1.5"

;
; provide x health points when executing the task
;
; decrease this value for slower healing
; increase this value for faster healing
;

"@hp_amount_per_task"   "1"

;
; play sound? players will have to download a file if yes
;

"@play_sound"           "0"

;
; if "1", only the healed player will hear the bandaging sound
;
; if "0", players close to the healed player will hear as well
; of course, the volume will depend on the distance between them
;

"@speak_player"         "1"

;
; sound file (original credits: condition zero) [may be changed]
;
; default "items/kevlar.wav"
;

"@sound_file"           "items/kevlar.wav"

;
; other sound files
;
; "medic/bandage.wav"
; "medic/medic.wav"
;
; "items/kevlar.wav"
;
