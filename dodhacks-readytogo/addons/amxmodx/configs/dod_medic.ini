
;
; Maximum medic calls per player life.
;

"@max_times"        "2"

;
; Maximum HP per task interval.
;
; Decrease this value for slower healing.
; Increase this value for faster healing.
;

"@heal_step"        "2"

;
; Healing task interval measured in second(s).
;
; Decrease this value for slower healing.
; Increase this value for faster healing.
;

"@task_interval"    "0.1"

;
; Enable and precache a WAV sound file if "1".
;
; Players will have to download the file when
; joining the server.
;

"@wav_sound"        "1"

;
; If "1", only the caller will hear the sound.
;
; If "0", players close to the caller will
; hear it too.
;

"@wav_speak"        "1"

;
; WAV sample, if enabled above.
;
; Default is:      "medic/bandage.wav"
; For human voice: "medic/medic.wav"
;

"@wav_sample"       "medic/bandage.wav"

;
; Other common sound files (samples) below.
;
; "medic/bandage.wav"
; "medic/medic.wav"
;
; "items/kevlar.wav"
;
